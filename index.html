<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell Cycle Rush</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- HUD -->
  <div id="hud">
    <div class="hud-row">
      <div class="stat">
        <span class="stat-label"><span class="heart-icon">♥</span> VIDA</span>
        <div class="bar bar-health"><div id="healthFill" class="bar-fill health-fill"></div></div>
      </div>
      <div class="stat">
        <span class="stat-label">ENERGIA</span>
        <div class="bar bar-energy"><div id="energyFill" class="bar-fill energy-fill"></div></div>
      </div>
      <div class="stat stat-time">
        <span class="stat-label">TEMPO</span>
        <span id="timerText" class="stat-value">0:00</span>
      </div>
    </div>
    <div class="hud-row hud-row-phase">
      <span id="phaseLabel" class="phase-label">Interfase</span>
      <div class="bar bar-progress"><div id="progressFill" class="bar-fill progress-fill"></div></div>
    </div>
    <div class="hud-row">
      <span class="objective-tag">OBJETIVO</span>
      <span id="objectiveText" class="objective-text">—</span>
      <span class="devoradores-tag">DEVORADORES: <span id="devouradoresCount">0</span></span>
    </div>
  </div>

  <!-- Game world -->
  <div id="canvasWrap">
    <canvas id="gameCanvas" width="900" height="560"></canvas>

    <!-- Indicador grande da fase atual (aparece e some sozinho) -->
    <div id="phaseBanner" class="phase-banner"><span id="phaseBannerText"></span></div>

    <!-- Title screen -->
    <div id="titleScreen" class="overlay">
      <h1 class="title">CELL CYCLE RUSH</h1>
      <p class="subtitle">A última célula precisa se dividir para salvar o organismo.</p>
      <p class="prompt">Pressione ENTER ou clique para começar</p>
      <p class="controls-hint">Movimento: WASD ou Setas &nbsp;•&nbsp; Ataque: ESPAÇO, F ou clique</p>
    </div>

    <!-- End screen -->
    <div id="endScreen" class="overlay hidden">
      <h1 id="endTitle" class="title end-title">MITOSE CONCLUÍDA</h1>
      <p id="endMessage" class="subtitle"></p>
      <button id="playAgainBtn" class="btn hidden">Jogar novamente</button>
      <button id="retryBtn" class="btn hidden">Tentar novamente</button>
    </div>
  </div>

  <!-- Dialogue box -->
  <div id="dialogueBox" class="hidden">
    <p id="dialogueText"></p>
    <span class="dialogue-hint">▶ clique / ENTER</span>
  </div>

</div>

<script src="js/audio.js"></script>
<script src="js/entities.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/phases.js"></script>
<script src="js/content.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
